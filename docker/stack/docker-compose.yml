# Minty — the whole system, one command.
#
# Starts all seven repos plus their shared PostgreSQL. Service names are also the
# hostnames inside the compose network:
#
#   db                   PostgreSQL 15                              localhost:5433
#   minty                Petty Cash — Flask (this repo)             localhost:8010
#   subscription-api     Subscriptions — Django API                 localhost:8000
#   minty-web            The hub — Next.js UI                       localhost:3000
#   payment-request-api  Payment Request — Django API               localhost:8020
#   payment-request-web  Payment Request — Next.js UI               localhost:3020
#   onboarding-api       Onboarding — Django API                    localhost:8030
#   onboarding-web       Onboarding — Next.js UI                    localhost:3030
#
# Ports follow one slot per domain: 30N0 for a web app, 80N0 for its API (hub and
# subscriptions N=0, Petty Cash 8010, payment request N=2, onboarding N=3). The
# full service / port / URL / variable reference is docs/ENVIRONMENT.md.
#
# The repos are checked out side by side under a common parent (C:\Github\...).
# Build contexts below reach out of this repo into the siblings; override the
# *_PATH variables in .env if your layout differs.
#
# Run it from THIS directory so docker-compose.override.yml (hot-reload for the
# Python services) and .env are picked up automatically:
#
#   cd docker/stack
#   cp .env.example .env
#   docker compose up --build
#
# See README.md in this folder.
#
# Requires Docker Compose v2.24+ (for `env_file: required: false`).
name: minty-stack

# Built once, used by every app service. The schema rides in the URL (?schema=) and is
# popped off before the driver connects; all services share the one schema.
x-database-url: &database-url postgresql://${POSTGRES_USER:-minty_ref_user}:${POSTGRES_PASSWORD:-minty_ref_pass}@db:5432/${POSTGRES_DB:-minty_ref}?schema=${DB_SCHEMA:-pettycashv3}

# The one value that MUST be identical across services: Flask mints the JWTs, the
# Django APIs verify them with this same key. A mismatch is a 401 on every handoff.
x-secret-key: &secret-key ${SECRET_KEY:-minty_stack_shared_secret_key}

services:
  # ---------------------------------------------------------------------------
  # Shared database. Every service lives in the `pettycashv3` schema of this one
  # database — that sharing is the whole point, so they must never be pointed at
  # separate databases. POSTGRES_* configure this container only; the apps get
  # DATABASE_URL above.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: minty-stack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minty_ref}
      POSTGRES_USER: ${POSTGRES_USER:-minty_ref_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minty_ref_pass}
    ports:
      # Published on 5433 so a locally-installed Postgres on 5432 doesn't clash.
      # The services always reach the db internally on db:5432 regardless.
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minty_ref_user} -d ${POSTGRES_DB:-minty_ref}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Petty Cash — Flask. Owns the schema: its entrypoint creates `pettycashv3` and
  # runs the Alembic migrations, so everything else waits for it to be healthy.
  # ---------------------------------------------------------------------------
  minty:
    build:
      context: ${MINTY_PATH:-../..}
      dockerfile: docker/Dockerfile
    container_name: minty-stack-minty
    restart: unless-stopped
    env_file:
      # Layered lowest-first; the `environment:` block below always wins over
      # both. Your existing per-repo .env supplies the secrets (Stripe, Xero,
      # SMTP_URL, S3_URL) so you don't have to copy them into the stack .env.
      - path: ${MINTY_PATH:-../..}/.env
        required: false
      - path: ./.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      PYTHONUNBUFFERED: "1"
      SECRET_KEY: *secret-key
      DATABASE_URL: *database-url
      # Cross-module links. These end up in the browser's address bar (redirects,
      # email links, the Xero callback), so they are localhost URLs, NOT container
      # names. The Xero redirect URI is PETTY_CASH_URL/callback.
      PETTY_CASH_URL: http://localhost:${MINTY_HOST_PORT:-8010}
      MINTY_WEB_URL: http://localhost:${MINTY_WEB_HOST_PORT:-3000}
      SUBSCRIPTION_API_URL: http://localhost:${SUBSCRIPTION_API_HOST_PORT:-8000}
      PAYMENT_REQUEST_WEB_URL: http://localhost:${PAYMENT_REQUEST_WEB_HOST_PORT:-3020}
      ONBOARDING_WEB_URL: http://localhost:${ONBOARDING_WEB_HOST_PORT:-3030}
      S3_URL: ${S3_URL:-https://dummy-key:dummy-secret@s3.us-west-004.backblazeb2.com/dummy-bucket}
      # Off by default — see "Getting a schema" in README.md. The Alembic chain
      # cannot currently build a database from empty.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    ports:
      - "${MINTY_HOST_PORT:-8010}:8010"
    healthcheck:
      # Only turns healthy once the entrypoint has finished migrating and
      # gunicorn is serving — which is exactly the gate the Django APIs need.
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    command:
      - "gunicorn"
      - "-w"
      - "${GUNICORN_WORKERS:-4}"
      - "-b"
      - "0.0.0.0:8010"
      - "main:app"

  # ---------------------------------------------------------------------------
  # Payment Request API — Django (minty-payment-request-api). Reads Flask's tables
  # through `search_path=pettycashv3`, so it can only migrate after Flask has
  # created that schema.
  # ---------------------------------------------------------------------------
  payment-request-api:
    build:
      context: ${PAYMENT_REQUEST_API_PATH:-../../../minty-payment-request-api}
      dockerfile: Dockerfile
    container_name: minty-stack-payment-request-api
    restart: unless-stopped
    env_file:
      - path: ${PAYMENT_REQUEST_API_PATH:-../../../minty-payment-request-api}/.env
        required: false
      - path: ./.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      minty:
        # Waits for the pettycashv3 schema and the Flask tables to exist.
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      PYTHONUNBUFFERED: "1"
      APP_ENV: ${APP_ENV:-development}
      # Same key as Flask above. A mismatch here means every cross-module
      # handoff fails with an invalid-signature 401.
      SECRET_KEY: *secret-key
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DATABASE_URL: *database-url
      # Server-to-server only (chart sync, Xero token fetch) — never reaches a
      # browser, so it uses the internal service name and skips the host network.
      PETTY_CASH_URL: http://minty:8010
      # Browser-facing (redirect target and CORS origins), so localhost. CORS
      # defaults to these two origins.
      PAYMENT_REQUEST_WEB_URL: http://localhost:${PAYMENT_REQUEST_WEB_HOST_PORT:-3020}
      ONBOARDING_WEB_URL: http://localhost:${ONBOARDING_WEB_HOST_PORT:-3030}
      S3_URL: ${S3_URL:-https://dummy-key:dummy-secret@s3.us-west-004.backblazeb2.com/dummy-bucket}
      # Off by default — see "Getting a schema" in README.md. The Alembic chain
      # cannot currently build a database from empty.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    ports:
      - "${PAYMENT_REQUEST_API_HOST_PORT:-8020}:8020"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import socket; socket.create_connection(('127.0.0.1', 8020), timeout=3).close()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    command:
      - "gunicorn"
      - "-w"
      - "${GUNICORN_WORKERS:-4}"
      - "-b"
      - "0.0.0.0:8020"
      - "config.wsgi:application"

  # ---------------------------------------------------------------------------
  # Payment Request web — Next.js (minty-payment-request-web). Runs the dev server
  # with the source bind-mounted, so the env below is read when the dev server
  # starts and editing a file reloads the page.
  # ---------------------------------------------------------------------------
  payment-request-web:
    build:
      context: ${PAYMENT_REQUEST_WEB_PATH:-../../../minty-payment-request-web}
      dockerfile: docker/Dockerfile
    container_name: minty-stack-payment-request-web
    restart: unless-stopped
    depends_on:
      - payment-request-api
    environment:
      # Everything below is fetched by the *browser*, so these must be host
      # URLs. Container names would resolve inside the network but not on your
      # machine, and every request from the page would fail.
      PETTY_CASH_URL: http://localhost:${MINTY_HOST_PORT:-8010}
      PAYMENT_REQUEST_API_URL: http://localhost:${PAYMENT_REQUEST_API_HOST_PORT:-8020}
      SUBSCRIPTION_API_URL: http://localhost:${SUBSCRIPTION_API_HOST_PORT:-8000}
      NODE_ENV: development
      # Bind mounts on Windows/macOS don't deliver inotify events reliably.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${PAYMENT_REQUEST_WEB_HOST_PORT:-3020}:3020"
    volumes:
      - ${PAYMENT_REQUEST_WEB_PATH:-../../../minty-payment-request-web}:/app
      # Anonymous volumes keep the image's own node_modules / build cache
      # instead of letting the host's shadow them.
      - /app/node_modules
      - /app/.next

  # ---------------------------------------------------------------------------
  # Onboarding API — the wizard's backend, extracted from the Flask app. Django +
  # django-ninja against the SAME pettycashv3 schema, with managed = False models
  # and no migrations of its own: Alembic in Minty stays owner-of-record.
  #
  # Roughly two thirds of its endpoints are thin proxies back to Flask (Stripe,
  # Xero tokens, subscription writes — rails only one service may touch), which is
  # why it needs PETTY_CASH_URL even though it shares the database.
  # ---------------------------------------------------------------------------
  onboarding-api:
    build:
      context: ${ONBOARDING_API_PATH:-../../../minty-onboarding-api}
      dockerfile: Dockerfile
    container_name: minty-stack-onboarding-api
    restart: unless-stopped
    env_file:
      - path: ${ONBOARDING_API_PATH:-../../../minty-onboarding-api}/.env
        required: false
      - path: ./.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      minty:
        # Waits for the pettycashv3 schema and the Flask tables to exist.
        condition: service_healthy
      subscription-api:
        # Cards, billing consent and finalize's trial start are proxied there.
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      PYTHONUNBUFFERED: "1"
      APP_ENV: ${APP_ENV:-development}
      # Same key as Flask and payment-request-api. Flask MINTS the onboarding JWT and
      # this service only verifies it, so a mismatch is not a boot failure — it is
      # a 401 on every request, which the wizard reports as an expired session.
      SECRET_KEY: *secret-key
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DATABASE_URL: *database-url
      # Server-to-server: the proxied endpoints and the Xero token fetch. Internal
      # service name, so it never leaves the compose network.
      PETTY_CASH_URL: http://minty:8010
      # Server-to-server: cards, billing consent and finalize's trial start.
      SUBSCRIPTION_API_URL: http://subscription-api:8000
      # Only the wizard calls this API from a browser, so CORS defaults to its origin.
      ONBOARDING_WEB_URL: http://localhost:${ONBOARDING_WEB_HOST_PORT:-3030}
      # Must agree with Minty's hardcoded Asia/Hong_Kong, or the two disagree about
      # what "today" is and the wizard's date picker caps on the wrong day.
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Asia/Hong_Kong}
    ports:
      - "${ONBOARDING_API_HOST_PORT:-8030}:8030"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import socket; socket.create_connection(('127.0.0.1', 8030), timeout=3).close()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    command:
      - "gunicorn"
      - "-w"
      - "${GUNICORN_WORKERS:-4}"
      - "-b"
      - "0.0.0.0:8030"
      - "config.wsgi:application"

  # ---------------------------------------------------------------------------
  # Onboarding web — Next.js (minty-onboarding-web). Talks to Flask and to the
  # onboarding API, both from the browser.
  # ---------------------------------------------------------------------------
  onboarding-web:
    build:
      context: ${ONBOARDING_WEB_PATH:-../../../minty-onboarding-web}
      dockerfile: docker/Dockerfile
    container_name: minty-stack-onboarding-web
    restart: unless-stopped
    depends_on:
      - minty
      - onboarding-api
    environment:
      # Browser-facing → localhost, not the internal service names. Which paths go
      # to the onboarding API vs to Flask is decided in the wizard's lib/apiRoutes.js.
      PETTY_CASH_URL: http://localhost:${MINTY_HOST_PORT:-8010}
      ONBOARDING_API_URL: http://localhost:${ONBOARDING_API_HOST_PORT:-8030}
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${ONBOARDING_WEB_HOST_PORT:-3030}:3030"
    volumes:
      - ${ONBOARDING_WEB_PATH:-../../../minty-onboarding-web}:/app
      - /app/node_modules
      - /app/.next

  # ---------------------------------------------------------------------------
  # Subscription API — Django (minty-subscription-api). Django + django-ninja on
  # Python 3.13 against the SAME schema, managed = False models and no migrations
  # of its own. The single Stripe writer; verifies Flask's token, never mints one.
  # Its in-process scheduler runs only with SUBSCRIPTION_SCHEDULER_ENABLED=1.
  # ---------------------------------------------------------------------------
  subscription-api:
    build:
      context: ${SUBSCRIPTION_API_PATH:-../../../minty-subscription-api}
      dockerfile: Dockerfile
    container_name: minty-stack-subscription-api
    restart: unless-stopped
    env_file:
      # Stripe keys and SMTP_URL / MAIL_FROM come from the repo's .env or this one.
      - path: ${SUBSCRIPTION_API_PATH:-../../../minty-subscription-api}/.env
        required: false
      - path: ./.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      minty:
        # Waits for the pettycashv3 schema and the Flask tables to exist.
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      PYTHONUNBUFFERED: "1"
      APP_ENV: ${APP_ENV:-development}
      # Same key as Flask: Flask mints the module JWT, this service only verifies it.
      SECRET_KEY: *secret-key
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DATABASE_URL: *database-url
      # The daily pass; the same value as Minty's (see .env.example) - never both on.
      SUBSCRIPTION_SCHEDULER_ENABLED: ${SUBSCRIPTION_SCHEDULER_ENABLED:-0}
      # Server-to-server: the one forwarded call (invite-admin). Internal name.
      PETTY_CASH_URL: http://minty:8010
      # The address a PERSON reaches Petty Cash at - every link in a subscription email
      # goes through Flask's re-handoff there. Never the internal name above.
      PETTY_CASH_PUBLIC_URL: http://localhost:${MINTY_HOST_PORT:-8010}
      # Browser origins that call this API: minty-web and the payment-request UI (the
      # notice). CORS defaults to these plus PETTY_CASH_PUBLIC_URL.
      MINTY_WEB_URL: http://localhost:${MINTY_WEB_HOST_PORT:-3000}
      PAYMENT_REQUEST_WEB_URL: http://localhost:${PAYMENT_REQUEST_WEB_HOST_PORT:-3020}
    ports:
      - "${SUBSCRIPTION_API_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    command:
      # Two workers, two in-process schedulers: the pass's advisory lock lets one run.
      - "gunicorn"
      - "-w"
      - "2"
      - "-b"
      - "0.0.0.0:8000"
      - "config.wsgi:application"

  # ---------------------------------------------------------------------------
  # The hub — minty-web. Next.js on 3000. Talks to subscription-api from the
  # browser, and to Flask only through redirects.
  # ---------------------------------------------------------------------------
  minty-web:
    build:
      context: ${MINTY_WEB_PATH:-../../../minty-web}
      dockerfile: docker/Dockerfile
    container_name: minty-stack-minty-web
    restart: unless-stopped
    depends_on:
      - minty
      - subscription-api
    environment:
      # Everything below is fetched by the *browser* or used in a redirect, so host URLs.
      PETTY_CASH_URL: http://localhost:${MINTY_HOST_PORT:-8010}
      SUBSCRIPTION_API_URL: http://localhost:${SUBSCRIPTION_API_HOST_PORT:-8000}
      PAYMENT_REQUEST_WEB_URL: http://localhost:${PAYMENT_REQUEST_WEB_HOST_PORT:-3020}
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${MINTY_WEB_HOST_PORT:-3000}:3000"
    volumes:
      - ${MINTY_WEB_PATH:-../../../minty-web}:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
