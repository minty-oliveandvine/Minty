services:
  db:
    image: postgres:15-alpine
    container_name: minty-ref-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minty_ref}
      POSTGRES_USER: ${POSTGRES_USER:-minty_ref_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minty_ref_pass}
    ports:
      # Host port is configurable so a locally-installed Postgres on 5432 doesn't
      # clash. Override in .env, e.g. DB_HOST_PORT=5433. The app container always
      # reaches the db internally on 5432 regardless of this setting.
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minty_ref_user} -d ${POSTGRES_DB:-minty_ref}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: minty-ref-app
    restart: unless-stopped
    # Load the project-root .env into the container (app secrets, S3_URL, SMTP_URL, etc.).
    # Note: for ${VAR} substitution *inside this file* compose also needs
    # `--env-file ../.env`; the helper scripts and README use it.
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      # development | production. development turns on Flask debug and lets Xero's
      # OAuth callback run over plain http://localhost.
      APP_ENV: ${APP_ENV:-development}
      PYTHONUNBUFFERED: "1"
      SECRET_KEY: ${SECRET_KEY:-minty_ref_secret_key}
      # Built once from the db container's POSTGRES_* above; the schema rides in the URL
      # (?schema=, default pettycashv3) and is never passed to the driver.
      DATABASE_URL: postgresql://${POSTGRES_USER:-minty_ref_user}:${POSTGRES_PASSWORD:-minty_ref_pass}@db:5432/${POSTGRES_DB:-minty_ref}?schema=${DB_SCHEMA:-pettycashv3}
      # Dummy credentials let the app boot; uploads fail until ../.env has a real S3_URL.
      S3_URL: ${S3_URL:-https://dummy-key:dummy-secret@s3.us-west-004.backblazeb2.com/dummy-bucket}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    ports:
      - "8010:8010"
    command:
      - "gunicorn"
      - "-w"
      - "${GUNICORN_WORKERS:-4}"
      - "-b"
      - "0.0.0.0:8010"
      - "main:app"

volumes:
  postgres_data:
