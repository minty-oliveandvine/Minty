services:
  db:
    image: postgres:15-alpine
    container_name: minty-ref-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minty_ref}
      POSTGRES_USER: ${POSTGRES_USER:-minty_ref_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minty_ref_pass}
    ports:
      # Host port is configurable so a locally-installed Postgres on 5432 doesn't
      # clash. Override in .env, e.g. DB_HOST_PORT=5433. The app container always
      # reaches the db internally on 5432 regardless of this setting.
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minty_ref_user} -d ${POSTGRES_DB:-minty_ref}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: minty-ref-app
    restart: unless-stopped
    # Load the project-root .env into the container (app secrets, S3 keys, etc.).
    # Note: for ${VAR} substitution *inside this file* compose also needs
    # `--env-file ../.env`; the helper scripts and README use it.
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      FLASK_DEBUG: ${FLASK_DEBUG:-False}
      PYTHONUNBUFFERED: "1"
      SESSION_SECRET: ${SESSION_SECRET:-minty_ref_session_secret}
      SECRET_KEY: ${SECRET_KEY:-minty_ref_secret_key}
      WTF_CSRF_SECRET_KEY: ${WTF_CSRF_SECRET_KEY:-minty_ref_csrf_secret}
      LOCAL_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:-minty_ref_user}:${POSTGRES_PASSWORD:-minty_ref_pass}@db:5432/${POSTGRES_DB:-minty_ref}
      RDS_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:-minty_ref_user}:${POSTGRES_PASSWORD:-minty_ref_pass}@db:5432/${POSTGRES_DB:-minty_ref}
      S3_BUCKET: ${S3_BUCKET:-dummy-bucket}
      S3_KEY: ${S3_KEY:-dummy-key}
      S3_SECRET: ${S3_SECRET:-dummy-secret}
      S3_REGION: ${S3_REGION:-us-east-1}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    ports:
      - "5001:5001"
    command:
      - "gunicorn"
      - "-w"
      - "${GUNICORN_WORKERS:-4}"
      - "-b"
      - "0.0.0.0:5001"
      - "main:app"

volumes:
  postgres_data:
