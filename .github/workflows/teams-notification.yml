name: ClickUp Push Comments

on:
  push:
    branches:
      - PRESTAGING-PETTYCASH

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Add comment to ClickUp task
        run: |
          curl -X POST \
            "https://api.clickup.com/api/v2/task/86exzzrn3/comment" \
            -H "Authorization: ${{ secrets.CLICKUP_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "comment_text": "🚀 Git Push Alert\n\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nBy: ${{ github.actor }}\nCommit: ${{ github.event.head_commit.message }}\n\nhttps://github.com/${{ github.repository }}/commit/${{ github.sha }}"
            }'