<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petty Cash</title>
    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

    <!-- Custom Button Styles -->
    <style>
        .btn-primary {
            background-color: #4a7c59;
            border-color: #4a7c59;
        }
    
        .btn-primary:hover {
            background-color: #36543a;
            border-color: #36543a;
        }
    
        .btn-block {
            width: 100%;
        }
    
        .logo {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 80px;
            height: auto;
        }
    
        @media (max-width: 768px) {
            .logo {
                width: 60px;
            }
    
            .btn-block {
                font-size: 1rem;
            }
        }
    </style>
    
</head>
<body>
    <div class="container mt-5 text-center">
        <img src="{{ url_for('static', filename='img/logo.png') }}" class="logo" alt="Logo">
        <h1 class="text-center">Create New Passwords / 새 비밀번호 만들기</h1>
        <!-- Build form fields -->
        <form action="{{url_for('auth.reset_token', token=token)}}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="token" value="{{ token }}">
        <div class="form-group text-left">
            <label for="password" >
                {{ form.password.label }} 
            </label>
            {{ form.password(class_="form-control", size=32 ) }}
           </div>
         <div class="form-group text-left">
            <label for="confirm_password" >
                {{ form.confirm_password.label }} 
            </label>
            {{ form.confirm_password(class_="form-control", size=32 ) }}
         </div>
           {{ form.submit }}
        </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
