<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Cash Report - 일일 현금 리포트</title>
    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

    <!-- Custom Button Styles -->
    <style>

        /* Responsive Table Styling */
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch; /* Smooth scrolling for iOS */
            margin-bottom: 20px;
        }

        #adjustedOpeningBalance {
            font-weight: bold;
            background-color: #f8f9fa;
        }

        .btn-primary {
            background-color: #4a7c59;
            border-color: #4a7c59;
        }
    
        .btn-primary:hover {
            background-color: #36543a;
            border-color: #36543a;
        }
    
        .btn-block {
            width: 100%;
        }
    
        .logo {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 80px;
            height: auto;
        }
    
        .is-invalid {
            border-color: red;
        }
    
        @media (max-width: 768px) {
            .logo {
                width: 60px;
            }
    
            .btn-block {
                font-size: 1rem;
            }

            th, td {
                font-size: 0.9rem;
                padding: 10px;
            }

            select, input {
                font-size: 0.9rem;
            }

            button {
                font-size: 0.8rem;
                padding: 6px 12px;
            }
    }

                /* Stacking rows for very small devices (mobile) */
        @media (max-width: 480px) {
            .table {
                display: block;
            }

            thead {
                display: none; /* Hide headers */
            }

            tr {
                display: flex;
                flex-direction: column;
                margin-bottom: 15px;
                border: 1px solid #ddd;
            }

            td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 8px;
                font-size: 0.85rem;
                white-space: normal; /* Allow wrapping */
            }

            td::before {
                content: attr(data-label); /* Use 'data-label' for cell headers */
                font-weight: bold;
                color: #4a7c59;
                flex: 1;
                padding-right: 10px;
                text-align: left;
            }

            td select, td input, td button {
                flex: 2;
            }
        }

        /* Ensure a neat layout for the file upload and preview section */
        td[data-label="Files"] {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        td[data-label="Files"] input[type="file"],
        td[data-label="Files"] .preview-button {
            width: 100%;
            max-width: 200px;
            margin: 0 auto;
        }

        .file-preview-container {
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 100%;
            margin-top: 10px;
        }

        .file-preview-container img {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .file-preview-container embed {
            max-width: 100%;
            max-height: 300px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        /* Responsive styles for smaller screens */
        @media (max-width: 768px) {
            td[data-label="Files"] {
                flex-direction: column;
                align-items: flex-start;
            }

            td[data-label="Files"] input[type="file"],
            td[data-label="Files"] .preview-button {
                max-width: 100%;
                margin: 0;
            }

            .file-preview-container img,
            .file-preview-container embed {
                max-height: 200px; /* Adjust for smaller screens */
            }
        }



    </style>
    
</head>
<body>
    <div class="container mt-5">
        <img src="{{ url_for('static', filename='img/logo.png') }}" class="logo" alt="Logo">
        <h1 class="text-center">Find User / 사용자 찾기</h1>
        <div>
            <form action="{{url_for('user_management.find_user')}}" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
               <div class="form-group">
                <label for="first_name">
                    {{ form.first_name.label }} 
                </label>
                {{ form.first_name(class_="form-control", size=32 ) }}
               </div>
               <div class="form-group">
                <label for="last_name">
                    {{ form.last_name.label }} 
                </label>
                {{ form.last_name(class_="form-control", size=32 ) }}
               </div>
               <div class="form-group">
                <label for="entity_id">
                    {{ form.entity_id.label }} 
                </label>
                {{ form.entity_id(class_="form-control" ) }}
               </div>
               <button type="submit">Find</button>
            </form>
           
        </div>
    </div>
    <div class="container mt-5">
        <h5>Your User ID is: {%if userid.username %} <strong class="text-success">{{ userid.username }}</strong> {% else %} <strong class="text-danger">No user found.</strong> {% endif %}</h5>
        <a href="{{ url_for('auth.login') }}">Back to login</a>
    </div>
</body>
</html>
