{# Electronic + Delivery payment methods sections, shared by petty cash settings templates. #}
        <!-- Electronic Payment Methods Card -->
        <div class="mb-6 rounded-lg border border-gray-200 {% if is_view_only %}bg-gray-100{% else %}bg-white{% endif %} p-4 shadow-sm">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-semibold text-gray-800">Electronic</h3>
            <div class="flex items-center gap-3">
              <svg class="size-5 text-gray-400 transition-transform duration-200 ease-in-out cursor-pointer" id="electronicChevron" onclick="toggleElectronic()" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
              </svg>
            </div>
          </div>
          
          <!-- Electronic Content (Collapsible) -->
          <div id="electronicContent" {% if is_view_only %}class="settings-readonly"{% endif %}>
            <!-- Payment Methods List -->
            <div id="paymentMethodsList" class="mb-4 mt-4">
              <!-- Dynamic payment methods will be loaded here -->
            </div>
            
            <!-- Add New Method Button -->
            <button type="button" id="addMethodBtn" {% if is_view_only %}disabled{% endif %} class="w-full border-2 border-[#54D3DA] text-[#54D3DA] py-3 px-4 rounded-xl font-medium flex items-center justify-center gap-2 hover:bg-[#54D3DA]/10 transition-colors hover-scale-parent">
              <svg width="13" height="14" viewBox="0 0 13 14" fill="none" xmlns="http://www.w3.org/2000/svg" class="hover-scale">
                <path d="M5.57143 5.69643V0.125H7.42857V5.69643H13V7.55357H7.42857V13.125H5.57143V7.55357H0V5.69643H5.57143Z" fill="currentColor"/>
              </svg>
              Add New Method
            </button>
            
            <!-- Add Method Form (Hidden by default) -->
            <div id="addMethodForm" class="hidden">
              <div class="space-y-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">Name</label>
                  <input type="text" id="methodName" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#54D3DA] focus:border-transparent cursor-pointer" placeholder="Enter payment method name">
                </div>
                <div class="flex justify-end gap-3">
                  <button type="button" id="cancelMethodBtn" class="flex-1 border-2 border-[#54D3DA] text-[#54D3DA] py-3 px-4 rounded-xl font-medium flex items-center justify-center gap-2 hover:bg-[#54D3DA]/10 transition-colors">
                    Cancel
                  </button>
                  <button type="button" id="saveMethodBtn" class="flex-1 bg-[#54D3DA] text-white py-3 px-4 rounded-xl font-medium flex items-center justify-center gap-2 hover:bg-[#54D3DA]/80 transition-colors">
                    Add
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Delivery Sales Card -->
        <div class="mb-6 rounded-lg border border-gray-200 {% if is_view_only %}bg-gray-100{% else %}bg-white{% endif %} p-4 shadow-sm">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-semibold text-gray-800">Delivery</h3>
            <div class="flex items-center gap-3">
              <svg class="size-5 text-gray-400 transition-transform duration-200 ease-in-out cursor-pointer" id="deliveryChevron" onclick="toggleDelivery()" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
              </svg>
            </div>
          </div>
          
          <!-- Delivery Content (Collapsible) -->
          <div id="deliveryContent" {% if is_view_only %}class="settings-readonly"{% endif %}>
            <!-- Delivery Methods List -->
            <div id="deliveryMethodsList" class="mb-4 mt-4">
              <!-- Dynamic delivery methods will be loaded here -->
            </div>
            
            <!-- Add New Method Button -->
            <button type="button" id="addDeliveryMethodBtn" {% if is_view_only %}disabled{% endif %} class="w-full border-2 border-[#54D3DA] text-[#54D3DA] py-3 px-4 rounded-xl font-medium flex items-center justify-center gap-2 hover:bg-[#54D3DA]/10 transition-colors hover-scale-parent">
              <svg width="13" height="14" viewBox="0 0 13 14" fill="none" xmlns="http://www.w3.org/2000/svg" class="hover-scale">
                <path d="M5.57143 5.69643V0.125H7.42857V5.69643H13V7.55357H7.42857V13.125H5.57143V7.55357H0V5.69643H5.57143Z" fill="currentColor"/>
              </svg>
              Add New Method
            </button>
            
            <!-- Add Method Form (Hidden by default) -->
            <div id="addDeliveryMethodForm" class="hidden">
              <div class="space-y-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">Name</label>
                  <input type="text" id="deliveryMethodName" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#54D3DA] focus:border-transparent cursor-pointer" placeholder="Enter delivery method name">
                </div>   
                <div class="flex justify-end gap-3">
                  <button type="button" id="cancelDeliveryMethodBtn" class="flex-1 border-2 border-[#54D3DA] text-[#54D3DA] py-3 px-4 rounded-xl font-medium flex items-center justify-center gap-2 hover:bg-[#54D3DA]/10 transition-colors">
                    Cancel
                  </button>
                  <button type="button" id="saveDeliveryMethodBtn" class="flex-1 bg-[#54D3DA] text-white py-3 px-4 rounded-xl font-medium flex items-center justify-center gap-2 hover:bg-[#54D3DA]/80 transition-colors">
                    Add
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
