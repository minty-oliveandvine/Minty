      const content = document.getElementById('electronicContent');
      const icon = document.getElementById('electronicChevron');
      
      if (content && icon) {
        if (content.style.display === 'none') {
          content.style.display = 'block';
          icon.style.transform = 'rotate(180deg)';
        } else {
          content.style.display = 'none';
          icon.style.transform = 'rotate(0deg)';
        }

        addMethodBtn.addEventListener('click', function() {
          addMethodForm.classList.remove('hidden');
          addMethodBtn.classList.add('hidden');
          methodNameInput.focus();
        });
      }

      // Cancel adding method
      if (cancelMethodBtn) {
        cancelMethodBtn.addEventListener('click', function() {
          addMethodForm.classList.add('hidden');
          addMethodBtn.classList.remove('hidden');
          methodNameInput.value = '';
        });
      }

      // Save new method
      if (saveMethodBtn) {
        saveMethodBtn.addEventListener('click', function() {
          const methodName = methodNameInput.value.trim();
          
          if (methodName) {
            // Add new method to the list
            addElectronicMethod(methodName);
            
            // Reset form
            methodNameInput.value = '';
            addMethodForm.classList.add('hidden');
            addMethodBtn.classList.remove('hidden');
          }
        });
      }

      // Allow Enter key to save
      if (methodNameInput) {
        methodNameInput.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            saveMethodBtn.click();
          }
        });

    }

    // Remove payment method
    function removePaymentMethod(button) {
      const methodRow = button.closest('.payment-method-item');
      if (methodRow) {
        methodRow.remove();
      }
    }

    // Edit payment method inline
    function editPaymentMethod(spanElement) {
      const currentText = spanElement.textContent;
      const parentContainer = spanElement.closest('.payment-method-item');
      
      // Create input field
      const input = document.createElement('input');
      input.type = 'text';
      input.value = currentText;
      input.className = 'text-gray-700 bg-transparent border-none outline-none focus:outline-none';
      input.style.fontSize = 'inherit';
      input.style.fontWeight = 'inherit';
      input.style.width = 'auto';
      input.style.minWidth = '60px';
      input.style.maxWidth = '200px';
      input.style.height = 'inherit';
      input.style.lineHeight = 'inherit';
      input.style.padding = '0';
      input.style.margin = '0';
      input.style.boxSizing = 'border-box';
      input.style.borderRadius = '6px';
      
      // Replace span with input
      spanElement.style.display = 'none';
      spanElement.parentNode.insertBefore(input, spanElement);
      
      // Focus and select text
      input.focus();
      input.select();
      
      // Save on Enter or blur
      function saveEdit() {
        const newText = input.value.trim();
        if (newText && newText !== currentText) {
          spanElement.textContent = newText;
          parentContainer.setAttribute('data-method', newText);
        }
        input.remove();
        spanElement.style.display = '';
      }
      
      // Cancel on Escape
      function cancelEdit() {
        input.remove();
        spanElement.style.display = '';
      }
      
      input.addEventListener('blur', saveEdit);
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          saveEdit();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          cancelEdit();
        }
      });
    }

    // Drag and Drop functionality
    let draggedElement = null;
    let touchStartY = 0;
    let touchCurrentY = 0;
    let isDragging = false;

    function addDragListeners(element) {
      // Desktop drag and drop
      element.addEventListener('dragstart', handleDragStart);
      element.addEventListener('dragend', handleDragEnd);
      element.addEventListener('dragover', handleDragOver);
      element.addEventListener('drop', handleDrop);
      
      // Mobile touch support
      element.addEventListener('touchstart', handleTouchStart, { passive: false });
      element.addEventListener('touchmove', handleTouchMove, { passive: false });
      element.addEventListener('touchend', handleTouchEnd, { passive: false });
    }

    function handleDragStart(e) {
      draggedElement = this;
      this.style.opacity = '0.5';
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/html', this.outerHTML);
    }

    function handleDragEnd(e) {
      this.style.opacity = '';
      draggedElement = null;
    }

    function handleDragOver(e) {
      if (e.preventDefault) {
        e.preventDefault();
      }
      e.dataTransfer.dropEffect = 'move';
      return false;
    }

    function handleDrop(e) {
      if (e.stopPropagation) {
        e.stopPropagation();
      }

      if (draggedElement !== this) {
        const methodsList = document.getElementById('paymentMethodsList');
        const draggedIndex = Array.from(methodsList.children).indexOf(draggedElement);
        const targetIndex = Array.from(methodsList.children).indexOf(this);

        if (draggedIndex < targetIndex) {
          methodsList.insertBefore(draggedElement, this.nextSibling);
        } else {
          methodsList.insertBefore(draggedElement, this);
        }
        
        // Log the new order after swapping
        const newOrder = Array.from(methodsList.children).map((item, index) => {
          return `${index + 1}. ${item.dataset.method}`;
        });
        console.log('🔄 Electronic Methods Reordered:', newOrder.join(' | '));
        
          // Store reorder for later save (don't save immediately)
          console.log('📝 Electronic methods reorder pending save');
      }

      return false;
    }

    // Mobile touch handlers
    function handleTouchStart(e) {
      if (e.touches.length === 1) {
        draggedElement = this;
        touchStartY = e.touches[0].clientY;
        touchCurrentY = touchStartY;
        isDragging = false;
        this.style.transition = 'none';
      }
    }

    function handleTouchMove(e) {
      if (e.touches.length === 1 && draggedElement) {
        e.preventDefault();
        touchCurrentY = e.touches[0].clientY;
        const deltaY = touchCurrentY - touchStartY;
        
        if (Math.abs(deltaY) > 10) {
          isDragging = true;
          draggedElement.style.opacity = '0.5';
          draggedElement.style.transform = `translateY(${deltaY}px)`;
        }
      }
    }

    function handleTouchEnd(e) {
      if (draggedElement && isDragging) {
        e.preventDefault();
        
        // Find the element that should be swapped
        const elements = Array.from(document.querySelectorAll('.electronic-method-item'));
        const draggedIndex = elements.indexOf(draggedElement);
        
        // Find the target element based on touch position
        let targetElement = null;
        for (let element of elements) {
          if (element !== draggedElement) {
            const rect = element.getBoundingClientRect();
            const elementCenterY = rect.top + rect.height / 2;
            
            if (touchCurrentY < elementCenterY) {
              targetElement = element;
              break;
            }
          }
        }
        
        // Perform the swap
        if (targetElement) {
          const methodsList = document.getElementById('paymentMethodsList');
          const targetIndex = elements.indexOf(targetElement);
          
          if (draggedIndex < targetIndex) {
            methodsList.insertBefore(draggedElement, targetElement.nextSibling);
          } else {
            methodsList.insertBefore(draggedElement, targetElement);
          }
          
          // Log the new order after swapping (mobile touch)
          const newOrder = Array.from(methodsList.children).map((item, index) => {
            return `${index + 1}. ${item.dataset.method}`;
          });
          console.log('📱 Electronic Methods Reordered (Touch):', newOrder.join(' | '));
          
          // Store reorder for later save (don't save immediately)
          console.log('📝 Electronic methods reorder pending save (Touch)');
        }
        
        // Reset styles
        draggedElement.style.opacity = '';
        draggedElement.style.transform = '';
        draggedElement.style.transition = '';
        
        draggedElement = null;
        isDragging = false;
      }
    }

      const newId = `electronic_${Date.now()}`;
      const electronicMethodsList = document.getElementById('paymentMethodsList');
      
      // Calculate display_order based on current DOM position (where it will appear)
      // If there are existing methods, use the last one's order + 1, otherwise start at 1
      let displayOrder = 1;
      if (electronicMethodsList && electronicMethodsList.children.length > 0) {
        // Get the last method's display_order from the data
        const lastMethod = paymentMethodsData.electronic[paymentMethodsData.electronic.length - 1];
        if (lastMethod && lastMethod.display_order) {
          displayOrder = lastMethod.display_order + 1;
        } else {
          displayOrder = paymentMethodsData.electronic.length + 1;
        }
      }
      
      const newMethod = {
        id: newId,
        name: name,
        type: "Electronic",
        value_name: name.toLowerCase() + '_sales',
        enabled: true,
        display_order: displayOrder

      // Add to local data (not saved to database yet)
      paymentMethodsData.electronic.push(newMethod);
      
      // Reload the methods list to show the new method in UI
      loadElectronicMethods();
      
      // Show success toast notification
      showSuccessToast(`${name} is added!`);

          type: 'electronic',

          methodName: methodName,

        // Remove from data array so it doesn't reappear when reloading methods

    // Inline edit functionality for payment methods
    function editPaymentMethodInline(spanElement) {
      const currentText = spanElement.textContent;
      const parentContainer = spanElement.closest('.electronic-method-item, .delivery-method-item');
      
      // Create input field
      const input = document.createElement('input');
      input.type = 'text';
      input.value = currentText;
      input.className = 'w-32 px-2 py-1 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-[#54D3DA] focus:border-transparent';
      
      // Replace span with input
      spanElement.parentNode.replaceChild(input, spanElement);
      input.focus();
      input.select();
      
      // Save on Enter or blur
      function saveEdit() {
        const newName = input.value.trim();
        if (newName && newName !== currentText) {
          // Update the span with new name
          const newSpan = document.createElement('span');
          newSpan.className = 'text-gray-700 cursor-pointer hover:text-b[#54D3DA]transition-colors';
          newSpan.textContent = newName;
          newSpan.onclick = function() { editPaymentMethodInline(this); };
          
          // Update data attributes
          if (parentContainer) {
            parentContainer.dataset.method = newName;
          }
          
          // Replace input with new span
          input.parentNode.replaceChild(newSpan, input);
          
          // Update the local data only (will be saved when "Save Changes" is clicked)
            const methodId = parentContainer.dataset.id;
          
          // Find and update in local data
          const electronicIndex = paymentMethodsData.electronic.findIndex(m => m.id === methodId);
          if (electronicIndex !== -1) {
            paymentMethodsData.electronic[electronicIndex].name = newName;
          }
          
          const deliveryIndex = paymentMethodsData.delivery.findIndex(m => m.id === methodId);
          if (deliveryIndex !== -1) {
            paymentMethodsData.delivery[deliveryIndex].name = newName;
          }
          
          console.log('Updated method name from', currentText, 'to', newName, '(will save on form submit)');
        } else {
          // Restore original span if no change
          const originalSpan = document.createElement('span');
          originalSpan.className = 'text-gray-700 cursor-pointer hover:text-[#54D3DA] transition-colors';
          originalSpan.textContent = currentText;
          originalSpan.onclick = function() { editPaymentMethodInline(this); };
          
          input.parentNode.replaceChild(originalSpan, input);
        }
      }
      
      // Save on Enter key
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          saveEdit();
        } else if (e.key === 'Escape') {
          // Cancel edit
          const originalSpan = document.createElement('span');
          originalSpan.className = 'text-gray-700 cursor-pointer hover:text-[#54D3DA] transition-colors';
          originalSpan.textContent = currentText;
          originalSpan.onclick = function() { editPaymentMethodInline(this); };
          
          input.parentNode.replaceChild(originalSpan, input);
        }
      });
      
      // Save on blur
      input.addEventListener('blur', saveEdit);
    }

    // Initialize payment methods when page loads
    document.addEventListener('DOMContentLoaded', function() {
      // Get the entity_id and fetch real data first
      const entityId = '{{org.id}}';
      if (entityId) {
        fetch(`/api/entities/${entityId}/payment-methods`)
          .then(response => response.json())
          .then(data => {
            // Replace mock data with real data
            const electronicMethodsData = [];
            const deliveryMethodsData = [];
            data.payment_methods.forEach(method => {
              if (method.type === 'Electronic') {
                electronicMethodsData.push(method);
              } else if (method.type === 'Delivery') {
                deliveryMethodsData.push(method);
              }
            });

            // Update the global data
            paymentMethodsData.electronic = electronicMethodsData;
            paymentMethodsData.delivery = deliveryMethodsData;

            // Now initialize with real data
            initializePaymentMethods();
          })
          .catch(error => {
            console.error('Failed to fetch payment methods:', error);
            if (window.sendLogToDataDog) {
              window.sendLogToDataDog('error', 'Failed to fetch payment methods', { message: error && error.message });
            }
            // Fallback to mock data if API fails
            initializePaymentMethods();
          });
      } else {
        // No entity ID, use mock data
        initializePaymentMethods();
      }
      
      // Override existing functions to include logging
      const originalAddElectronicMethod = addElectronicMethod;
      addElectronicMethod = function(name) {
        originalAddElectronicMethod(name);
        logSalesValues();
      };
      
      const originalAddDeliveryMethod = addDeliveryMethod;
      addDeliveryMethod = function(name) {
        originalAddDeliveryMethod(name);
        logSalesValues();
      };
      
      const originalRemoveElectronicMethod = removeElectronicMethod;
      removeElectronicMethod = function(button) {
        originalRemoveElectronicMethod(button);
        logSalesValues();
      };
      
      const originalRemoveDeliveryMethod = removeDeliveryMethod;
      removeDeliveryMethod = function(button) {
        originalRemoveDeliveryMethod(button);
        logSalesValues();
      };
      
      // Log initial values
      setTimeout(() => {
        logSalesValues();
      }, 1000);
      
      // Add keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        // Ctrl/Cmd + L to log sales values
        if ((e.ctrlKey || e.metaKey) && e.key === 'l') {
          e.preventDefault();
          logSalesValues();
        }
      });
      
      // Handle form submission to save payment method changes
      const form = document.getElementById('entitySettingsForm');
      if (form) {
        form.addEventListener('submit', async function(e) {
          e.preventDefault();
          
          // Show loading overlay
          const saveBtn = document.getElementById('saveChangesBtn');
          const loadingOverlay = document.getElementById('loadingOverlay');
          const loadingText = document.getElementById('loadingText');
          
          if (saveBtn) {
            saveBtn.disabled = true;
          }
          
          if (loadingOverlay) {
            loadingOverlay.classList.remove('hidden');
            if (loadingText) {
              loadingText.textContent = 'Saving Changes...';
            }
          }
          
          // Save all payment method name changes
          const updatePromises = [];
          const addPromises = [];
          
          // Separate new methods (with temporary IDs) from existing methods
          const newElectronicMethods = paymentMethodsData.electronic.filter(m => m.id.startsWith('electronic_'));
          const existingElectronicMethods = paymentMethodsData.electronic.filter(m => !m.id.startsWith('electronic_'));
          
          const newDeliveryMethods = paymentMethodsData.delivery.filter(m => m.id.startsWith('delivery_'));
          const existingDeliveryMethods = paymentMethodsData.delivery.filter(m => !m.id.startsWith('delivery_'));
          
          // Update existing electronic methods (name changes)
          existingElectronicMethods.forEach(method => {
            updatePromises.push(
              fetch(`/api/entities/{{org.id}}/payment-methods/${method.id}`, {
                method: 'PUT',
                headers: {
                  'Content-Type': 'application/json',
                  'X-CSRFToken': '{{csrf_token()}}'
                },
                body: JSON.stringify({ name: method.name })
              })
            );
          });
          
          // Update existing delivery methods (name changes)
          existingDeliveryMethods.forEach(method => {
            updatePromises.push(
              fetch(`/api/entities/{{org.id}}/payment-methods/${method.id}`, {
                method: 'PUT',
                headers: {
                  'Content-Type': 'application/json',
                  'X-CSRFToken': '{{csrf_token()}}'
                },
                body: JSON.stringify({ name: method.name })
              })
            );
          });
          
          // Add new electronic methods
          newElectronicMethods.forEach(method => {
            addPromises.push(
              fetch(`/api/entities/{{org.id}}/payment-methods`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'X-CSRFToken': '{{csrf_token()}}'
                },
                body: JSON.stringify({
                  name: method.name,
                  type: method.type,
                  value_name: method.value_name,
                  enabled: method.enabled,
                  display_order: method.display_order
                })
              }).then(response => response.json())
              .then(data => {
                // Update the method in the local array with the real ID from the API
                const methodIndex = paymentMethodsData.electronic.findIndex(m => m.id === method.id);
                if (methodIndex !== -1 && data.payment_method) {
                  const oldId = paymentMethodsData.electronic[methodIndex].id;
                  paymentMethodsData.electronic[methodIndex].id = data.payment_method.id;
                  
                  // Update the DOM element's data-id attribute with the real ID
                  const electronicMethodsList = document.getElementById('paymentMethodsList');
                  if (electronicMethodsList) {
                    const element = electronicMethodsList.querySelector(`[data-id="${oldId}"]`);
                    if (element) {
                      element.dataset.id = data.payment_method.id;
                    }
                  }
                }
              })
            );
          });
          
          // Add new delivery methods
          newDeliveryMethods.forEach(method => {
            addPromises.push(
              fetch(`/api/entities/{{org.id}}/payment-methods`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'X-CSRFToken': '{{csrf_token()}}'
                },
                body: JSON.stringify({
                  name: method.name,
                  type: method.type,
                  value_name: method.value_name,
                  enabled: method.enabled,
                  display_order: method.display_order
                })
              }).then(response => response.json())
              .then(data => {
                // Update the method in the local array with the real ID from the API
                const methodIndex = paymentMethodsData.delivery.findIndex(m => m.id === method.id);
                if (methodIndex !== -1 && data.payment_method) {
                  const oldId = paymentMethodsData.delivery[methodIndex].id;
                  paymentMethodsData.delivery[methodIndex].id = data.payment_method.id;
                  
                  // Update the DOM element's data-id attribute with the real ID
                  const deliveryMethodsList = document.getElementById('deliveryMethodsList');
                  if (deliveryMethodsList) {
                    const element = deliveryMethodsList.querySelector(`[data-id="${oldId}"]`);
                    if (element) {
                      element.dataset.id = data.payment_method.id;
                    }
                  }
                }
              })
            );
          });
          
          try {
            // Process pending deletions first
            if (window.pendingDeletions && window.pendingDeletions.length > 0) {
              console.log('Processing pending deletions:', window.pendingDeletions);
              
              const deletionPromises = window.pendingDeletions.map(pendingDelete => {
                return fetch(`/api/entities/{{org.id}}/payment-methods/${pendingDelete.methodId}`, {
                  method: 'DELETE',
                  headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{csrf_token()}}'
                  }
                }).then(response => {
                  if (response.ok) {
                    console.log(`Successfully deleted ${pendingDelete.type} method:`, pendingDelete.methodName);
                    // Element already removed from DOM when deletion was confirmed
                  } else {
                    console.error(`Failed to delete ${pendingDelete.type} method:`, pendingDelete.methodName);
                  }
                }).catch(error => {
                  console.error(`Error deleting ${pendingDelete.type} method:`, error);
                  if (window.sendLogToDataDog) {
                    window.sendLogToDataDog('error', 'Error deleting payment method', { type: pendingDelete.type, message: error && error.message });
                  }
                });
              });
              
              await Promise.all(deletionPromises);
              console.log('All pending deletions completed');
              
              // Clear pending deletions
              window.pendingDeletions = [];
            }
            
            // Wait for all new methods to be added first and get their real IDs
            if (addPromises.length > 0) {
              await Promise.all(addPromises);
              console.log('All new methods added and IDs updated');
            }
            
            // Process reorders for both electronic and delivery methods (after new methods have real IDs)
            const reorderPromises = [];
            
            // Process electronic methods reorder
            const electronicMethodsList = document.getElementById('paymentMethodsList');
            if (electronicMethodsList) {
              const electronicMethodIds = Array.from(electronicMethodsList.children).map(item => item.dataset.id);
              console.log('📋 Electronic methods order for reorder:', electronicMethodIds);
              reorderPromises.push(
                fetch(`/api/entities/{{org.id}}/payment-methods/reorder`, {
                  method: 'PUT',
                  headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{csrf_token()}}'
                  },
                  body: JSON.stringify({ method_ids: electronicMethodIds })
                }).then(response => {
                  if (response.ok) {
                    console.log('✅ Electronic methods reorder saved');
                  } else {
                    console.error('❌ Failed to save electronic methods reorder');
                  }
                }).catch(error => {
                  console.error('❌ Error saving electronic methods reorder:', error);
                  if (window.sendLogToDataDog) {
                    window.sendLogToDataDog('error', 'Error saving electronic methods reorder', { message: error && error.message });
                  }
                })
              );
            }
            
            // Process delivery methods reorder
            const deliveryMethodsList = document.getElementById('deliveryMethodsList');
            if (deliveryMethodsList) {
              const deliveryMethodIds = Array.from(deliveryMethodsList.children).map(item => item.dataset.id);
              console.log('📋 Delivery methods order for reorder:', deliveryMethodIds);
              reorderPromises.push(
                fetch(`/api/entities/{{org.id}}/payment-methods/reorder`, {
                  method: 'PUT',
                  headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{csrf_token()}}'
                  },
                  body: JSON.stringify({ method_ids: deliveryMethodIds })
                }).then(response => {
                  if (response.ok) {
                    console.log('✅ Delivery methods reorder saved');
                  } else {
                    console.error('❌ Failed to save delivery methods reorder');
                  }
                }).catch(error => {
                  console.error('❌ Error saving delivery methods reorder:', error);
                  if (window.sendLogToDataDog) {
                    window.sendLogToDataDog('error', 'Error saving delivery methods reorder', { message: error && error.message });
                  }
                })
              );
            }
            
            // Wait for all reorders to complete
            if (reorderPromises.length > 0) {
              await Promise.all(reorderPromises);
              console.log('All method reorders completed');
            }
            
            // Wait for all updates to complete
            await Promise.all(updatePromises);
            console.log('All payment method updates completed');
            console.log('Submitting form with selected account codes:', Array.from(checkedAccountCodes));
            // Native submit bypasses this submit listener and posts every field in
            // #entitySettingsForm (Xero mapping, account_codes[], country_code, etc.).
            form.submit();
          } catch (error) {
            console.error('Error updating payment methods:', error);
            if (window.sendLogToDataDog) {
              window.sendLogToDataDog('error', 'Error updating payment methods', { message: error && error.message });
            }
            // Hide loading overlay and re-enable button on error
            const loadingOverlay = document.getElementById('loadingOverlay');
            const saveBtn = document.getElementById('saveChangesBtn');
            if (loadingOverlay) {
              loadingOverlay.classList.add('hidden');
            }
            if (saveBtn) {
              saveBtn.disabled = false;
            }
            // Submit form anyway
            form.submit();
          }
        });
      }
    });

    // Toast notification functions
    function showErrorToast(message = 'Error updating entity settings') {
      const notification = document.getElementById('settingsNotification');
      // Bills-UI pages have no classic toast elements; delegate to the
      // new-design slide-in toast (components/flash_messages.html).
      if (!notification && typeof window.showSettingsFlashToast === 'function') {
        window.showSettingsFlashToast(message, 'error');
        return;
      }
      const errorToast = document.getElementById('errorToast');
      const successToast = document.getElementById('successToast');

      if (notification && errorToast) {
        // Hide success toast if visible
        if (successToast) {
          successToast.classList.add('hidden');
        }
        
        // Update error message if provided
        const messageElement = document.getElementById('errorMessage');
        if (messageElement && message) {
          messageElement.textContent = message;
        }
        
        // Show error toast
        errorToast.classList.remove('hidden');
        notification.classList.remove('translate-x-full');
        notification.classList.add('translate-x-0');
        
        // Auto-hide after 4 seconds
        setTimeout(() => {
          hideSettingsNotification();
        }, 4000);
      }
    }

    function showSuccessToast(message = 'Your entity settings are saved!') {
      const notification = document.getElementById('settingsNotification');
      // Bills-UI pages have no classic toast elements; delegate to the
      // new-design slide-in toast (components/flash_messages.html).
      if (!notification && typeof window.showSettingsFlashToast === 'function') {
        window.showSettingsFlashToast(message, 'success');
        return;
      }
      const errorToast = document.getElementById('errorToast');
      const successToast = document.getElementById('successToast');

      if (notification && successToast) {
        // Hide error toast if visible
        if (errorToast) {
          errorToast.classList.add('hidden');
        }
        
        // Update success message if provided
        const messageElement = document.getElementById('successMessage');
        if (messageElement && message) {
          messageElement.textContent = message;
        }
        
        // Show success toast
        successToast.classList.remove('hidden');
        notification.classList.remove('translate-x-full');
        notification.classList.add('translate-x-0');
        
        // Auto-hide after 4 seconds
        setTimeout(() => {
          hideSettingsNotification();
        }, 4000);
      }
    }

    function hideSettingsNotification() {
      const notification = document.getElementById('settingsNotification');
      if (notification) {
        notification.classList.remove('translate-x-0');
        notification.classList.add('translate-x-full');
      }
    }

    // Delete Confirmation Modal Functions
    function showDeleteConfirmModal(type, methodName) {
      const modal = document.getElementById('deleteConfirmModal');
      const modalTitle = document.getElementById('deleteModalTitle');
      const modalMessage = document.getElementById('deleteModalMessage');
      
      modalTitle.textContent = `Delete ${type} Method`;
      modalMessage.innerHTML = `Are you sure you want to delete "<strong>${methodName}</strong>"? This action cannot be undone.`;
      
      modal.classList.remove('hidden');
    }

    function hideDeleteConfirmModal() {
      const modal = document.getElementById('deleteConfirmModal');
      modal.classList.add('hidden');
      
      // Clear pending deletes
      window.pendingElectronicDelete = null;
      window.pendingDeliveryDelete = null;
    }

    function confirmDelete() {
      // Determine which type of deletion to perform
      if (window.pendingElectronicDelete) {
        confirmElectronicDelete();
      } else if (window.pendingDeliveryDelete) {
        confirmDeliveryDelete();
      }
    }

    // Function to clear all pending deletions (called when user cancels or leaves page)
    // Note: Elements are already removed from DOM, so they will reappear on page refresh
    function clearPendingDeletions() {
      if (window.pendingDeletions && window.pendingDeletions.length > 0) {
        // Clear the array - elements will be restored on page refresh since they're still in the database
        window.pendingDeletions = [];
        console.log('Cleared all pending deletions');
      }
    }

    // Settings menu functions
    function toggleSettingsMenu(button) {
      const dropdown = button.querySelector('.settings-menu-dropdown');
      if (dropdown) {
        // Close all other open menus first
        document.querySelectorAll('.settings-menu-dropdown').forEach(menu => {
          if (menu !== dropdown) {
            menu.classList.add('hidden');
          }
        });
        
        // Toggle current menu
        dropdown.classList.toggle('hidden');
      }
    }

    function closeSettingsMenu(button) {
      if (button) {
        const dropdown = button.querySelector('.settings-menu-dropdown');
        if (dropdown) {
          dropdown.classList.add('hidden');
        }
      }
    }

    // Update Move Up/Down button states based on position
    function updateMoveButtonStates(type) {
      const container = type === 'electronic' 
        ? document.getElementById('paymentMethodsList')
        : document.getElementById('deliveryMethodsList');
      
      if (!container) return;
      
      const methodItems = Array.from(container.querySelectorAll(`.${type}-method-item`));
      const totalItems = methodItems.length;
      
      methodItems.forEach((methodItem, index) => {
        const settingsMenu = methodItem.querySelector('.settings-menu-dropdown');
        if (!settingsMenu) return;
        
        const moveUpBtn = settingsMenu.querySelector('.move-up-btn');
        const moveDownBtn = settingsMenu.querySelector('.move-down-btn');
        
        if (moveUpBtn) {
          if (index === 0) {
            // First item - disable Move Up
            moveUpBtn.classList.add('opacity-50', 'cursor-not-allowed');
            moveUpBtn.classList.remove('hover:bg-gray-50', 'cursor-pointer');
            moveUpBtn.style.pointerEvents = 'none';
          } else {
            // Enable Move Up
            moveUpBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            moveUpBtn.classList.add('hover:bg-gray-50', 'cursor-pointer');
            moveUpBtn.style.pointerEvents = 'auto';
          }
        }
        
        if (moveDownBtn) {
          if (index === totalItems - 1) {
            // Last item - disable Move Down
            moveDownBtn.classList.add('opacity-50', 'cursor-not-allowed');
            moveDownBtn.classList.remove('hover:bg-gray-50', 'cursor-pointer');
            moveDownBtn.style.pointerEvents = 'none';
          } else {
            // Enable Move Down
            moveDownBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            moveDownBtn.classList.add('hover:bg-gray-50', 'cursor-pointer');
            moveDownBtn.style.pointerEvents = 'auto';
          }
        }
      });
    }

    // Handle Move Up
    function handleMoveUp(element, type) {
      const methodItem = element.closest(`.${type}-method-item`);
      const methodsList = methodItem.parentElement;
      const currentIndex = Array.from(methodsList.children).indexOf(methodItem);
      
      if (currentIndex > 0) {
        methodsList.insertBefore(methodItem, methodsList.children[currentIndex - 1]);
        console.log(`Moved ${type} method up`);
        // Update button states after moving
        updateMoveButtonStates(type);
      }
    }

    // Handle Move Down
    function handleMoveDown(element, type) {
      const methodItem = element.closest(`.${type}-method-item`);
      const methodsList = methodItem.parentElement;
      const currentIndex = Array.from(methodsList.children).indexOf(methodItem);
      
      if (currentIndex < methodsList.children.length - 1) {
        methodsList.insertBefore(methodItem, methodsList.children[currentIndex + 1].nextSibling);
        console.log(`Moved ${type} method down`);
        // Update button states after moving
        updateMoveButtonStates(type);
      }
    }

    // Handle Delete Method
    function handleDeleteMethod(element, type) {
      const methodItem = element.closest(`.${type}-method-item`);
      const methodName = methodItem.dataset.method;
      const methodId = methodItem.dataset.id;
      
      if (type === 'electronic') {
        // Store the method info for deletion
        window.pendingElectronicDelete = {
          methodItem: methodItem,
          methodName: methodName,
          methodId: methodId
        };
        showDeleteConfirmModal('Electronic', methodName);
      } else if (type === 'delivery') {
        // Store the method info for deletion
        window.pendingDeliveryDelete = {
          methodItem: methodItem,
          methodName: methodName,
          methodId: methodId
        };
        showDeleteConfirmModal('Delivery', methodName);
      }
    }

    // Close settings menus when clicking outside
    document.addEventListener('click', function(e) {
      const target = e.target;
      const isClickableChild = target.closest('a[title="Settings"]') ||
                              target.closest('.settings-menu-dropdown');
      
      if (!isClickableChild) {
        document.querySelectorAll('.settings-menu-dropdown').forEach(menu => {
          menu.classList.add('hidden');
        });
      }
    });


</script>
