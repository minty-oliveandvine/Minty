[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "minty-ref"
version = "0.1.0"
description = "Petty cash management web application"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "Flask==2.3.3",
  "Flask-Bcrypt==1.0.1",
  "flask-cors==6.0.1",
  "Flask-Headers==1.0",
  "Flask-Login==0.6.3",
  "Flask-Mail==0.10.0",
  "Flask-Migrate==4.0.7",
  "Flask-OAuthlib==0.9.6",
  "Flask-Session==0.8.0",
  "Flask-SQLAlchemy==3.1.1",
  "Flask-WTF==1.2.1",
  "SQLAlchemy==2.0.32",
  "WTForms==3.1.2",
  "alembic==1.13.2",
  "apscheduler==3.11.0",
  "bcrypt==4.2.0",
  "boto3==1.35.8",
  "docx2pdf==0.1.8",
  "docxcompose==1.4.1",
  "docxtpl==0.20.1",
  "email-validator==2.2.0",
  "google-genai==2.22.0",
  "gunicorn==23.0.0",
  "loguru>=0.7.2",
  "iso4217==1.14.20250512",
  "lxml==6.0.1",
  "numpy==2.1.0",
  "openpyxl==3.1.5",
  "pandas==2.2.2",
  "phonenumbers==9.0.10",
  "pikepdf==9.4.0",
  "Pillow==11.0.0",
  "pycountry==24.6.1",
  "PyJWT==2.10.1",
  "psycopg2-binary==2.9.10",
  "PyMySQL==1.1.1",
  "pypandoc==1.15",
  "python-dateutil==2.9.0.post0",
  "python-docx==1.2.0",
  "python-dotenv==1.0.1",
  "pytz==2024.1",
  "requests==2.32.3",
  "requests-oauthlib==1.1.0",
  "selenium==4.35.0",
  "spire-doc==13.8.0",
  "stripe==11.4.1",
  "user-agents==2.2.0",
  "watchtower==3.3.1",
  "xero_python==1.5.3",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "ruff==0.6.9",
  "pytest==8.3.2",
  "pytest-xdist>=3.8.0",  # tests/: -n auto, one Postgres build per worker (tests/pg_harness.py)
  "black>=26.1.0",
  "isort>=8.0.1",
  "autopep8>=2.3.2",
  "autoflake>=2.3.3",
]

[tool.hatch.build.targets.wheel]
packages = [
  "pettycash",
  "blueprints",
  "services",
  "models",
  "utils",
]
